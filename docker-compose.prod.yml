services:
  postgres:
    image: postgres:16-alpine
    container_name: demo1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-demo1}
    volumes:
      - demo1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo1} -d ${POSTGRES_DB:-demo1}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo1-app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PUBLIC_PORT:-3011}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  demo1_postgres_data:
